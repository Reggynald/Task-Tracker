<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="header-row">
      <h1>Task Tracker</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark Mode umschalten">🌙</button>
    </div>

    <form id="add-form" class="add-form">
      <input
        type="text"
        id="description-input"
        placeholder="Neue Aufgabe eingeben..."
        autocomplete="off"
        required
      />
      <button type="submit">Hinzufügen</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-status="all">Alle</button>
      <button class="filter-btn" data-status="todo">Todo</button>
      <button class="filter-btn" data-status="in-progress">In Bearbeitung</button>
      <button class="filter-btn" data-status="done">Erledigt</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

<p id="empty-state" class="empty-state" hidden>Noch keine Aufgaben hier ✨</p>

    <div class="chalkboard-scene" id="chalkboard-scene">
      <div class="chalkboard">
        <div class="chalk-line"></div>
      </div>
      <div class="figure">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>
    </div>

    <button id="scene-toggle" class="scene-toggle" type="button">
      <span class="status-dot"></span>
      <span id="scene-toggle-label">Schreibt</span>
    </button>
  </main>

  <script src="app.js"></script>
</body>
</html>
